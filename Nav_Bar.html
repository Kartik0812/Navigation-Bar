<!DOCTYPE html>
<html>
<head>
    <title>Navigation Bar</title>
</head>
<body>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
            <div>
            <input type="#" placeholder="Search Here"
            <button>Search</button>
        </nav>
    </div>
    <style>
        nav{
            background-color: rgb(212, 55, 38);
            padding: 15px;
            text-align: center;
            text-decoration: none;
            font-size: 17px;        }
        a{
            padding: 15px;
            size: 10px;
        }
        div{
            padding: 10px;
            size: 10px;
            display: inline;
        }
        
    </style>
</body>
</html>
